when:
  - event: [push, pull_request, manual]

steps:
  - name: install
    image: node:22-bookworm
    commands:
      - corepack enable
      - corepack prepare pnpm@10.4.1 --activate
      - pnpm --version
      - pnpm install --frozen-lockfile

  - name: validate
    image: node:22-bookworm
    commands:
      - corepack enable
      - corepack prepare pnpm@10.4.1 --activate
      - pnpm check
      - pnpm test
      - pnpm build
      - node scripts/validate-migrations.mjs
