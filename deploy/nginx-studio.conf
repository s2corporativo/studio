# Novo server block para a VPS compartilhada, caso ela use Nginx em vez de
# Caddy. Salve como /etc/nginx/sites-available/studio.s2corporativo.com.br,
# ative com um symlink em sites-enabled e depois rode:
#   sudo certbot --nginx -d studio.s2corporativo.com.br
# O certbot reescreve este arquivo automaticamente para adicionar o bloco
# HTTPS (listen 443) e o redirect de 80 para 443 — não precisa fazer isso à mão.

server {
    listen 80;
    listen [::]:80;
    server_name studio.s2corporativo.com.br;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
