# Snippet de reverse proxy para Nginx — S2 Studio
#
# A VPS Contabo compartilhada já hospeda outros serviços (EJC, Verde Limp,
# S2 Licitações). Copie este arquivo para /etc/nginx/sites-available/,
# ajuste os caminhos de certificado TLS conforme o gerenciador já usado no
# host (certbot, acme.sh etc.) e ative com um symlink em sites-enabled —
# não substitua a configuração existente dos outros serviços.
#
# O app roda em um container Docker publicado apenas em 127.0.0.1:8080
# (ver docker-compose.yml).

server {
	listen 80;
	listen [::]:80;
	server_name studio.s2corporativo.com.br;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name studio.s2corporativo.com.br;

	# Ajuste para o caminho real dos certificados no host.
	ssl_certificate     /etc/letsencrypt/live/studio.s2corporativo.com.br/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/studio.s2corporativo.com.br/privkey.pem;

	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	access_log /var/log/nginx/studio.s2corporativo.com.br.access.log;
	error_log  /var/log/nginx/studio.s2corporativo.com.br.error.log;
}
