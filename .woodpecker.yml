# CI oficial self-hosted (Woodpecker). Não depende de GitHub Actions.
# Executa os gates funcionais e de segurança na VPS compartilhada, em sequência.
when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

steps:
  validate:
    image: node:22-bookworm
    commands:
      - npm install --global corepack@0.31.0
      - corepack enable
      - corepack prepare pnpm@10.4.1 --activate
      - pnpm --version
      - pnpm install --frozen-lockfile
      - pnpm check
      - pnpm test
      - pnpm build
      - pnpm brand:validate
      - node scripts/validate-migrations.mjs

  security-sast:
    image: semgrep/semgrep:1.172.0
    commands:
      - semgrep scan --config=auto --error .

  security-vulnerabilities:
    image: aquasec/trivy:0.74.0
    commands:
      - trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  security-secrets:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    commands:
      - gitleaks git . --redact --verbose --exit-code 1
